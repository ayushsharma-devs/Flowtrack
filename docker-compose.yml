version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: flowtrack-postgres
    restart: always
    environment:
      POSTGRES_DB: flowtrack_db
      POSTGRES_USER: flowtrack_user
      POSTGRES_PASSWORD: flowtrack_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
